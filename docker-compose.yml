services:
  juice-shop-source:
    image: alpine:latest
    container_name: juice-shop-source
    volumes:
      - ./juice-shop:/repo
    working_dir: /repo
    command: >
      sh -c "
        apk add --no-cache git &&
        if [ ! -d .git ]; then
          rm -rf * && git clone --depth 1 https://github.com/juice-shop/juice-shop.git . ;
        else
          echo 'juice-shop уже установлен';
        fi
      "

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports: 
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/rest/admin/application-version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  sqli-lab-backend:
    build: ./laboratorys/sqli
    container_name: sqli-lab-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  nosqli-mongo:
    image: mongo:7.0
    container_name: nosqli-mongo
    restart: unless-stopped
    volumes:
      - nosqli-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nosqli-lab-backend:
    build: ./laboratorys/nosqli
    container_name: nosqli-lab-backend
    depends_on:
      nosqli-mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://nosqli-mongo:27017
    ports:
      - "5002:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  fi-lab:
    profiles: [file-inclusion]
    build:
      context: .
      dockerfile: Dockerfile
      target: file-inclusion
    ports:
      - "127.0.0.1:5101:5101"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5101/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [file-inclusion-lab]

  fi-remote:
    profiles: [file-inclusion]
    build:
      context: .
      dockerfile: Dockerfile
      target: file-inclusion
    command: ["python", "LFI_RFI_remote.py"]
    ports:
      - "127.0.0.1:5102:5102"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5102/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [file-inclusion-lab]

  admin-app:
    build:
      context: ./target
      dockerfile: Dockerfile.flask
    container_name: admin-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 5

  ssrf-flask:
    build:
      context: ./target
      dockerfile: Dockerfile.ssrf-flask
    container_name: ssrf-flask
    ports:
      - "8090:8080"       
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  streamlit-app:
    build:
      context: ./target
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-app
    ports:
      - "8501:8501"
    depends_on:
      admin-app:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    container_name: cyber-security-agent
    depends_on: 
      juice-shop:
        condition: service_healthy
      juice-shop-source:
        condition: service_completed_successfully
      admin-app:
        condition: service_healthy
      ssrf-flask:
        condition: service_healthy
      nosqli-lab-backend:
        condition: service_healthy
    environment:
      - TARGET_URL=http://juice-shop:3000
      - SOURCE_PATH=/app/juice-shop
      - RULES_PATH=/app/rules/rules_semgrep.yaml
      - SQLI_LAB_URL=http://sqli-lab-backend:5000
      - SQLI_SOURCE_PATH=/app/sqli-lab
      - NOSQLI_LAB_URL=http://nosqli-lab-backend:5000
      - NOSQLI_SOURCE_PATH=/app/nosqli-lab
      - DAN_LAB_URL=http://dan-llm:5001
      - COMPOSE_NETWORK=cyber_security_agent_default
      - HOST_REPORTS_DIR=/app/reports
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./juice-shop:/app/juice-shop:ro
      - ./target:/app/target:ro  
      - ./laboratorys/sqli:/app/sqli-lab:ro
      - ./laboratorys/nosqli:/app/nosqli-lab:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    networks: [default, file-inclusion-lab]
    command: >
      python -u -m cyber_agent.agent.cli.main
      --url http://juice-shop:3000
      --source /app/juice-shop
      --rules /app/rules/rules_semgrep.yaml

  dan-llm:
    build: ./dan_llm
    container_name: dan-llm
    ports:
      - "5001:5001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default: {}
  file-inclusion-lab:
    internal: true

volumes:
  nosqli-mongo-data: